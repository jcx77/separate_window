<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/popup.js"></script> <!-- Use type="module" for ES6 modules -->
    <link rel="stylesheet" href="css/popup.css"/>
    <title>Separate Window</title>
</head>
<body>
<div id="error" class="error" data-i18n="error"></div>
<div id="main" class="main">
    <div id="controls">
        <div class="wrap-buttons">
            <input type="checkbox" id="select">
            <label id="btnSelect" for="select" class="button" data-i18n="txtButtonChoose"></label>
        </div>
        <div class="wrap-buttons">
            <input type="checkbox" id="popTab">
            <label id="txtButtonPopTab" for="popTab" class="button" data-i18n="txtButtonPopTab"></label>
        </div>
        <div class="wrap-buttons">
            <input type="checkbox" id="advSettings">
            <label id="btnAdvSettings" for="advSettings" class="button icon-cfg" data-i18n="txtButtonSettings"></label>
        </div>
        <div id="advCfg" class="wrap-settings">
            <!-- Settings toggle inputs -->
            <!-- Add the switch configuration here -->
            <div class="switch">
                <input type="checkbox" class="switch-checkbox" id="duplicate">
                <label id="btnDuplicate" class="switch-label" for="duplicate">
                    <span id="txtSwitch" class="switch-inner" data-i18n="popSwitch"></span>
                    <span class="switch-switch"></span>
                </label>
            </div>
            <!-- More Settings can be added below -->
        </div>
    </div>
    <div id="history" class="wrap-history">
        <span id="historyTxt" class="comment separator" data-i18n="txtHistory"></span>
        <div id="last" class="wrapper"></div>
    </div>
</div>
</body>
</html>
